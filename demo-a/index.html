<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0; padding: 0;
    background:
      radial-gradient(120% 85% at 50% 38%, #0b1220 0%, #06070d 55%, #030407 100%);
  }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: true });

const COUNT = 900;
const FADE = 0.055;

// ---------- deterministic value noise ----------
function hash2(x, y) {
  let h = Math.imul(x, 374761393) + Math.imul(y, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}
function smooth(t) { return t * t * (3 - 2 * t); }
function noise2(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const u = smooth(x - xi), v = smooth(y - yi);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi);
  const c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
}

// curl of a scalar potential -> divergence-free swirl field
// EPS is in NOISE space, so it must be small relative to the 0.0016 px->noise scale
const EPS = 0.012;
function curl(x, y, t) {
  const px = x * 0.0016 + t * 0.05;
  const py = y * 0.0016 - t * 0.035;
  const dPsiDy = (noise2(px, py + EPS) - noise2(px, py - EPS)) / (2 * EPS);
  const dPsiDx = (noise2(px + EPS, py) - noise2(px - EPS, py)) / (2 * EPS);
  return [ dPsiDy, -dPsiDx ];
}

function rng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), 1 | t);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

let particles = [];
let frame = -1;

function seed() {
  const r = rng(20261104);
  particles = [];
  for (let i = 0; i < COUNT; i++) {
    const x = r() * W;
    const y = r() * H;
    particles.push({
      x: x,
      y: y,
      vx: 0,
      vy: 0,
      // hue sweeps down the frame: teal at the top -> violet -> warm at the bottom
      hue: 172 + (y / H) * 128 + r() * 22,
      sat: 85 + r() * 15,
      weight: 0.5 + r() * 1.3,
      speed: 0.55 + r() * 0.9,
    });
  }
}

function reset() {
  ctx.clearRect(0, 0, W, H);
  seed();
  frame = -1;
}

function step(f) {
  // real alpha fade on a transparent layer -> keeps the CSS gradient visible
  ctx.globalCompositeOperation = 'destination-out';
  ctx.fillStyle = 'rgba(0, 0, 0, ' + FADE + ')';
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = 'lighter';

  const t = f / 30;
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    const [cx, cy] = curl(p.x, p.y, t);

    p.vx = (p.vx + cx * 2.6 * p.speed) * 0.94;
    p.vy = (p.vy + cy * 2.6 * p.speed) * 0.94;

    const sp = Math.hypot(p.vx, p.vy);
    if (sp > 8) { p.vx = (p.vx / sp) * 8; p.vy = (p.vy / sp) * 8; }

    const px = p.x, py = p.y;
    p.x += p.vx;
    p.y += p.vy;

    // NEVER stroke across a wrap -> respawn instead (wrapped strokes are the
    // horizontal "scan line" artifact), and skip drawing on this frame
    if (p.x < 0 || p.x > W || p.y < 0 || p.y > H) {
      const r1 = hash2(i * 7 + 1, f);
      const r2 = hash2(i * 7 + 3, f);
      p.x = r1 * W;
      p.y = r2 * H;
      p.vx = 0;
      p.vy = 0;
      continue;
    }

    const heat = Math.min(1, sp / 7);
    const lum = 48 + heat * 38;
    const alpha = 0.10 + heat * 0.26;

    // glow pass: additive, wide and cheap
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'hsla(' + p.hue + ', ' + p.sat + '%, ' + lum + '%, ' + (alpha * 0.40) + ')';
    ctx.lineWidth = p.weight * 5;
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();

    // core pass: normal blending keeps the hue saturated instead of washing to white
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = 'hsla(' + p.hue + ', ' + p.sat + '%, ' + Math.min(72, lum + 14) + '%, ' + Math.min(1, alpha * 3.1) + ')';
    ctx.lineWidth = p.weight * (0.65 + heat * 0.9);
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  }
}

window.renderFrame = function (target) {
  if (target <= frame) reset();
  while (frame < target) {
    frame += 1;
    step(frame);
  }
  return frame;
};

reset();
window.__ready = true;
</script>
</body>
</html>
